version: 2

models:
  # --- STAGING LAYER ---
  - name: stg_transactions
    description: "Staging table for financial transactions. Standardized with PII masking."
    tests:
      - dbt_utils.expression_is_true:
          expression: "ingestion_timestamp >= transaction_time"
    columns:
      - name: transaction_id
        tests:
          - unique
          - not_null
      - name: user_uuid
        tests:
          - not_null
          - relationships:
              to: ref('stg_customers')
              field: user_uuid
      - name: amount_eur
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              inclusive: true

  - name: stg_customers
    description: "Customer master data. GDPR compliant with SHA-256 hashing."
    columns:
      - name: user_uuid
        tests:
          - unique
          - not_null
      - name: age
        tests:
          - dbt_utils.accepted_range:
              min_value: 18
              max_value: 120

  # --- INTERMEDIATE LAYER ---
  - name: int_risk_features
    description: "Adaptive feature layer including Geo-Intelligence and Behavioral Sigma metrics."
    columns:
      - name: is_geo_mismatch
        description: "Binary flag: 1 if transaction country != home_country."
        tests:
          - not_null
          - accepted_values:
              values: [0, 1]
      - name: daily_velocity
        description: "Transaction count per user/country in a rolling 24h window."
        tests:
          - not_null

  # --- GOLD LAYER (RISK DECISIONS) ---
  - name: fct_risk_decision
    description: "Final fact table for automated fraud risk assessments using Adaptive Sigma Logic."
    columns:
      - name: transaction_id
        tests:
          - unique
          - not_null
          - relationships:
              to: ref('stg_transactions')
              field: transaction_id
      - name: final_risk_score
        description: "Z-Score & Ratio based adaptive risk score. Range is dynamic based on volatility."
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0 # Removed max_value to support adaptive ratio scaling
      - name: final_action
        description: "Operational action determined by statistical deviation thresholds."
        tests:
          - not_null
          - accepted_values:
              # Updated to include FLAG_FOR_REVIEW as per Industry Standard sequence
              values: ['APPROVE', 'FLAG_FOR_REVIEW', 'OTP_REQUIRED', 'REJECT']
              quote: true

  # --- GOLD LAYER (FORENSIC ALERTS) ---
  - name: fct_forensic_alerts
    description: "Security audit trail for forensic incident reconstruction."
    columns:
      - name: transaction_id
        tests:
          - unique
          - not_null
      - name: alert_code
        description: "Machine-readable code for incident categorization."
        tests:
          - accepted_values:
              values: ['IMPOSSIBLE_TRAVEL', 'RAPID_IP_SWITCH', 'OUTLIER_SPEND']
              quote: true
      - name: alert_label
        description: "Human-readable label for SOC/Compliance analysts."
        tests:
          - not_null