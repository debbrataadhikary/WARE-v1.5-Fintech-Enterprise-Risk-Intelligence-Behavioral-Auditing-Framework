version: 2

models:
  # --- STAGING LAYER ---
  - name: stg_transactions
    description: "Staging table for financial transactions. Standardized for fraud analysis with PII masking."
    tests:
      - dbt_utils.expression_is_true:
          expression: "ingestion_timestamp >= transaction_time"
    columns:
      - name: transaction_id
        description: "Primary key. Unique identifier for each transaction."
        tests:
          - unique
          - not_null
      - name: user_uuid
        description: "Foreign key reference to stg_customers master table."
        tests:
          - not_null
          - relationships:
              to: ref('stg_customers')
              field: user_uuid
      - name: amount_eur
        description: "Transaction amount in EUR. Must be a positive value."
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              inclusive: true
      - name: country
        description: "Country code associated with the transaction."
        tests:
          - not_null

  - name: stg_customers
    description: "Customer master data. GDPR compliant with SHA-256 hashing for sensitive identifiers."
    columns:
      - name: user_uuid
        description: "Unique persistent identifier for customers."
        tests:
          - unique
          - not_null
      - name: age
        description: "Customer age at registration. Compliance requires minimum age of 18."
        tests:
          - dbt_utils.accepted_range:
              min_value: 18
              max_value: 120

  # --- INTERMEDIATE LAYER ---
  - name: int_user_behavior_metrics
    description: "Intermediate behavioral features including spending profiles."
    columns:
      - name: avg_spend
        description: "Historical mean expenditure for the customer profile."
        tests:
          - dbt_utils.accepted_range:
              min_value: 0

  # --- GOLD LAYER (RISK DECISIONS) ---
  - name: fct_risk_decision
    description: "Final fact table containing automated fraud risk assessments."
    columns:
      - name: transaction_id
        description: "Reference to the original transaction record."
        tests:
          - unique
          - not_null
          - relationships:
              to: ref('stg_transactions')
              field: transaction_id
      - name: final_risk_score
        description: "Risk score (0-100) generated by the fraud engine."
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 100
      - name: final_action
        description: "Operational determination based on the risk engine logic."
        tests:
          - not_null
          - accepted_values:
              values: ['APPROVE', 'ALLOW', 'OTP_REQUIRED', 'OTP', 'REJECT']
              quote: true

  # --- GOLD LAYER (FORENSIC ALERTS) ---
  - name: fct_forensic_alerts
    description: "Gold layer table for identified fraudulent and high-risk transactions."
    columns:
      - name: transaction_id
        description: "Primary key for each transaction"
        tests:
          - unique
          - not_null
      - name: alert_code
        description: "Machine-readable code for the risk type"
        tests:
          - accepted_values:
              values: ['IMPOSSIBLE_TRAVEL', 'RAPID_IP_SWITCH', 'OUTLIER_SPEND']
              quote: true
      - name: amount_eur
        description: "Transaction amount in EUR"
        tests:
          - not_null